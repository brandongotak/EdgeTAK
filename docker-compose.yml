# EdgeTAK with Docker Compose:
#
#   docker compose up -d
#   docker compose logs edgetak      # shows the first admin password
#
# Update: docker compose pull && docker compose up -d
# Settings below apply on every start; everything else is set in the admin
# console or in edgetak.json inside the data volume.
services:
  edgetak:
    image: ghcr.io/brandongotak/edgetak:latest
    container_name: edgetak
    restart: unless-stopped
    environment:
      # The address devices use to reach this server (an IP or a domain).
      EDGETAK_PUBLIC_HOST: tak.example.com
      # Let's Encrypt on 8446 so devices connect with just address, username
      # and password. Needs EDGETAK_PUBLIC_HOST to be a domain pointing here
      # and port 80 open (uncomment "80:80" below).
      # EDGETAK_LETSENCRYPT: "1"
      # Turn off the anonymous plain ports 8087 and 8080 (internet servers).
      # EDGETAK_NO_PLAINTEXT: "1"
      # Video (the bundled MediaMTX) is on; "0" turns it off (and drop the
      # video ports below).
      # EDGETAK_VIDEO: "0"
    ports:
      - "8089:8089"   # CoT over TLS (devices)
      - "8443:8443"   # Marti API and admin console
      - "8446:8446"   # certificate enrollment, sign-up page
      - "8087:8087"   # CoT plain TCP (local networks only)
      - "8080:8080"   # plain HTTP API for 8087 clients
      - "8554:8554"       # video: RTSP
      - "1935:1935"       # video: RTMP
      - "8890:8890/udp"   # video: SRT
      # - "80:80"         # Let's Encrypt
    volumes:
      - edgetak-data:/data

volumes:
  edgetak-data:
